<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynavia — Dashboard IoT Semáforos</title>
<link href="https://fonts.googleapis.com/css2?family=Atma:wght@500&family=Acme&family=Gabriela&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f0f4ff;
    font-family: 'Gabriela', serif;
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    background: #fff;
    border-bottom: 1.5px solid #dde3f5;
    padding: 16px 40px;
    display: flex;
    align-items: center;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    font-family: 'Atma', cursive;
    font-weight: 500;
    font-size: 26px;
    color: #2d4de0;
    letter-spacing: 1px;
  }

  .header-tagline {
    font-family: 'Acme', sans-serif;
    font-size: 12px;
    color: #8892b0;
    letter-spacing: 0.4px;
  }

  .live-pill {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    background: #edfaf3;
    border: 1.5px solid #a7eeca;
    border-radius: 99px;
    padding: 5px 14px;
  }

  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #1db969;
    animation: livepulse 2s infinite;
  }

  .live-dot.offline { background: #e53e3e; animation: none; }

  @keyframes livepulse { 0%,100%{opacity:1} 50%{opacity:0.25} }

  .live-label {
    font-family: 'Acme', sans-serif;
    font-size: 11px;
    color: #1a9952;
  }

  /* MAIN LAYOUT */
  .main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    padding: 28px 40px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .col-span { grid-column: span 2; }

  /* CARDS */
  .card {
    background: #fff;
    border-radius: 18px;
    border: 1.5px solid #dde3f5;
    padding: 24px 22px;
  }

  .card-title {
    font-family: 'Atma', cursive;
    font-weight: 500;
    font-size: 17px;
    color: #1e2a6e;
    margin-bottom: 3px;
  }

  .card-sub {
    font-family: 'Acme', sans-serif;
    font-size: 11px;
    color: #8892b0;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 20px;
  }

  /* SEMÁFOROS */
  .semaphore-container {
    display: flex;
    justify-content: space-around;
    align-items: flex-end;
    padding: 8px 0 14px;
  }

  .sem-unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  .sem-visor {
    width: 58px;
    height: 8px;
    background: #374151;
    border-radius: 5px 5px 0 0;
    border: 1.5px solid #1f2937;
    border-bottom: none;
  }

  .sem-body {
    width: 56px;
    background: #374151;
    border-radius: 0 0 14px 14px;
    border: 1.5px solid #1f2937;
    border-top: none;
    padding: 10px 9px 13px;
    display: flex;
    flex-direction: column;
    gap: 0;
    align-items: center;
  }

  .sem-hood {
    width: 40px;
    height: 5px;
    background: #1f2937;
    border-radius: 2px 2px 0 0;
    margin-top: 5px;
  }

  .light {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid #111827;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
  }

  .light::after {
    content: '';
    position: absolute;
    top: 5px;
    left: 6px;
    width: 9px;
    height: 6px;
    background: rgba(255,255,255,0.18);
    border-radius: 50%;
    transform: rotate(-30deg);
  }

  /* Focos apagados */
  .light.red    { background: radial-gradient(circle at 40% 36%, #3d0c04, #1a0200); }
  .light.yellow { background: radial-gradient(circle at 40% 36%, #3a2800, #1a1000); }
  .light.green  { background: radial-gradient(circle at 40% 36%, #082e10, #031008); }
  .light.white  { background: radial-gradient(circle at 40% 36%, #141428, #08080f); }

  /* Focos encendidos */
  .light.red.on {
    background: radial-gradient(circle at 38% 34%, #ffaa88, #ff2200);
    border-color: #ff3300;
    box-shadow: 0 0 10px #ff220055, 0 0 20px #ff220022;
    animation: glR 2.5s ease-in-out infinite;
  }
  .light.yellow.on {
    background: radial-gradient(circle at 38% 34%, #ffee88, #ffaa00);
    border-color: #ff9900;
    box-shadow: 0 0 10px #ffaa0055, 0 0 20px #ffaa0022;
    animation: glY 2s ease-in-out infinite;
  }
  .light.green.on {
    background: radial-gradient(circle at 38% 34%, #99ffbb, #11cc44);
    border-color: #00bb33;
    box-shadow: 0 0 10px #11cc4455, 0 0 20px #11cc4422;
  }
  .light.white.on {
    background: radial-gradient(circle at 38% 34%, #ffffff, #c8daff);
    border-color: #7799ee;
    box-shadow: 0 0 12px #aabbff55, 0 0 24px #aabbff22;
    animation: glW 3s ease-in-out infinite;
  }

  @keyframes glR {
    0%,100%{box-shadow:0 0 10px #ff220055,0 0 20px #ff220022}
    50%{box-shadow:0 0 16px #ff220088,0 0 30px #ff220033}
  }
  @keyframes glY {
    0%,100%{box-shadow:0 0 10px #ffaa0055,0 0 20px #ffaa0022}
    50%{box-shadow:0 0 18px #ffaa0088,0 0 32px #ffaa0033}
  }
  @keyframes glW {
    0%,100%{box-shadow:0 0 12px #aabbff55,0 0 24px #aabbff22}
    50%{box-shadow:0 0 20px #aabbffaa,0 0 38px #aabbff44}
  }

  .sem-arm  { width: 40px; height: 6px; background: #6b7280; border-radius: 2px; }
  .sem-pole { width: 8px; height: 40px; background: #9ca3af; border-radius: 2px; }
  .sem-base { width: 22px; height: 6px; background: #6b7280; border-radius: 0 0 4px 4px; }

  .semaphore-id {
    font-family: 'Acme', sans-serif;
    font-size: 10px;
    color: #6b7280;
    margin-top: 5px;
    letter-spacing: 1px;
  }

  /* BANNER */
  .banner {
    border-radius: 12px;
    padding: 12px 16px;
    font-family: 'Gabriela', serif;
    font-size: 12.5px;
    text-align: center;
    border: 1.5px solid;
    transition: all 0.4s;
  }
  .banner.normal    { background: #edfaf3; border-color: #a7eeca; color: #166534; }
  .banner.emergency { background: #fff7ed; border-color: #fdba74; color: #9a3412; }

  /* STATS */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .stat {
    background: #f0f4ff;
    border-radius: 14px;
    border: 1.5px solid #dde3f5;
    padding: 16px 12px;
    text-align: center;
  }

  .stat-value {
    font-family: 'Atma', cursive;
    font-weight: 500;
    font-size: 34px;
    line-height: 1;
    color: #2d4de0;
  }
  .stat-value.danger { color: #dc2626; }
  .stat-value.ok     { color: #16a34a; }
  .stat-value.warm   { color: #d97706; }

  .stat-label {
    font-family: 'Acme', sans-serif;
    font-size: 11px;
    color: #8892b0;
    margin-top: 5px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* EVENTOS */
  .events-list {
    max-height: 320px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scrollbar-width: thin;
    scrollbar-color: #dde3f5 transparent;
  }

  .event-item {
    border-radius: 12px;
    padding: 13px 15px;
    border: 1.5px solid #e5e7eb;
    border-left-width: 4px;
    border-left-style: solid;
    background: #fafbff;
    transition: transform 0.15s;
  }
  .event-item:hover { transform: translateX(4px); }
  .event-item.active    { border-left-color: #ef4444; background: #fff8f8; }
  .event-item.completed { border-left-color: #22c55e; background: #f7fef9; }

  .event-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }

  .event-id {
    font-family: 'Atma', cursive;
    font-weight: 500;
    font-size: 13px;
    color: #1e2a6e;
  }

  .ev-badges { display: flex; gap: 6px; align-items: center; }

  .event-badge {
    font-family: 'Acme', sans-serif;
    font-size: 10px;
    padding: 3px 9px;
    border-radius: 99px;
    border: 1px solid;
  }
  .badge-active    { background: #fef2f2; color: #991b1b; border-color: #fca5a5; }
  .badge-completed { background: #f0fdf4; color: #166534; border-color: #86efac; }

  .level-badge {
    font-family: 'Acme', sans-serif;
    font-size: 10px;
    padding: 3px 9px;
    border-radius: 99px;
    border: 1px solid;
  }
  .level-1 { background: #fef2f2; color: #991b1b; border-color: #fca5a5; }
  .level-2 { background: #fffbeb; color: #92400e; border-color: #fcd34d; }
  .level-3 { background: #eff6ff; color: #1e40af; border-color: #93c5fd; }

  .event-meta {
    font-family: 'Gabriela', serif;
    font-size: 11px;
    color: #9ca3af;
    margin-top: 5px;
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">⚡ Dynavia</div>
  <span class="header-tagline">Dashboard IoT — semáforos en tiempo real</span>
  <div class="live-pill">
    <div class="live-dot" id="statusDot"></div>
    <span class="live-label" id="statusText">Conectado a NeonDB</span>
  </div>
</div>

<div class="main">

  <!-- Semáforos -->
  <div class="card">
    <div class="card-title">Estado de semáforos</div>
    <div class="card-sub">Red activa</div>
    <div class="semaphore-container" id="semaphoreContainer"></div>
    <div class="banner normal" id="emergencyBanner">Sin emergencias activas — ciclo normal</div>
  </div>

  <!-- Métricas -->
  <div class="card">
    <div class="card-title">Métricas del sistema</div>
    <div class="card-sub">Tiempo real</div>
    <div class="stats-grid">
      <div class="stat">
        <div class="stat-value" id="statTotal">0</div>
        <div class="stat-label">Total eventos</div>
      </div>
      <div class="stat">
        <div class="stat-value danger" id="statActive">0</div>
        <div class="stat-label">Activos</div>
      </div>
      <div class="stat">
        <div class="stat-value ok" id="statCompleted">0</div>
        <div class="stat-label">Completados</div>
      </div>
      <div class="stat">
        <div class="stat-value warm" id="statAvgDur">—</div>
        <div class="stat-label">Dur. promedio</div>
      </div>
    </div>
  </div>

  <!-- Historial -->
  <div class="card col-span">
    <div class="card-title">Eventos recientes</div>
    <div class="card-sub">Base de datos NeonDB</div>
    <div class="events-list" id="eventsList">
      <div style="color:#9ca3af;text-align:center;padding:32px;font-family:'Gabriela',serif">Cargando eventos...</div>
    </div>
  </div>

</div>

<script>
const BACKEND = 'http://192.168.56.101:3004';
const SEMAPHORES = ['SEM-001', 'SEM-002', 'SEM-003'];
let semaphoreState = {};
const POLL_INTERVAL = 2000;

function buildSemaphores() {
  const container = document.getElementById('semaphoreContainer');
  container.innerHTML = SEMAPHORES.map(id => `
    <div class="sem-unit">
      <div class="sem-visor"></div>
      <div class="sem-body" id="sem-${id}">
        <div class="sem-hood"></div>
        <div class="light red" id="${id}-red"></div>
        <div class="sem-hood"></div>
        <div class="light yellow" id="${id}-yellow"></div>
        <div class="sem-hood"></div>
        <div class="light green on" id="${id}-green"></div>
        <div class="sem-hood"></div>
        <div class="light white" id="${id}-white"></div>
      </div>
      <div class="sem-arm"></div>
      <div class="sem-pole"></div>
      <div class="sem-base"></div>
      <div class="semaphore-id">${id}</div>
    </div>
  `).join('');
  SEMAPHORES.forEach(id => semaphoreState[id] = 'normal');
}

function setSemaphore(id, mode) {
  ['red','yellow','green','white'].forEach(l =>
    document.getElementById(`${id}-${l}`)?.classList.remove('on')
  );
  if (mode === 'emergency') {
    document.getElementById(`${id}-white`)?.classList.add('on');
  } else {
    document.getElementById(`${id}-green`)?.classList.add('on');
  }
}

function formatDuration(s) {
  if (!s) return '--';
  const m = Math.floor(s/60), sec = s%60;
  return `${m}m ${sec}s`;
}

function formatDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  return `${dt.getDate()}/${dt.getMonth()+1} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
}

async function poll() {
  try {
    const res = await fetch(`${BACKEND}/events`);
    const data = await res.json();
    const events = data.events || [];

    document.getElementById('statusDot').className = 'live-dot';
    document.getElementById('statusText').textContent = 'Conectado a NeonDB';
    document.getElementById('statusText').style.color = '#1a9952';

    const active = events.filter(e => e.status === 'active');
    const completed = events.filter(e => e.status === 'completed');
    const durations = completed.filter(e => e.total_duration_seconds).map(e => e.total_duration_seconds);
    const avgDur = durations.length ? Math.round(durations.reduce((a,b)=>a+b,0)/durations.length) : 0;

    document.getElementById('statTotal').textContent = events.length;
    document.getElementById('statActive').textContent = active.length;
    document.getElementById('statCompleted').textContent = completed.length;
    document.getElementById('statAvgDur').textContent = formatDuration(avgDur);

    const latestEvent = events[0];
    const hasEmergency = latestEvent && latestEvent.status === 'active' && latestEvent.severity_level <= 2;
    const emergencyEvent = hasEmergency ? latestEvent : null;
    SEMAPHORES.forEach(id => setSemaphore(id, hasEmergency ? 'emergency' : 'normal'));

    const banner = document.getElementById('emergencyBanner');
    if (hasEmergency && emergencyEvent) {
      banner.className = 'banner emergency';
      banner.textContent = `EMERGENCIA ACTIVA — luz blanca preventiva · Nivel ${emergencyEvent.severity_level} · ${emergencyEvent.id}`;
    } else {
      banner.className = 'banner normal';
      banner.textContent = 'Sin emergencias activas — ciclo normal';
    }

    document.getElementById('eventsList').innerHTML = events.slice(0,10).map(e => `
      <div class="event-item ${e.status}">
        <div class="event-row">
          <span class="event-id">${e.id}</span>
          <div class="ev-badges">
            <span class="level-badge level-${e.severity_level}">Nivel ${e.severity_level}</span>
            <span class="event-badge ${e.status === 'active' ? 'badge-active' : 'badge-completed'}">
              ${e.status === 'active' ? '🔴 Activo' : '✅ Completado'}
            </span>
          </div>
        </div>
        <div class="event-meta">
          🚑 ${e.ambulance_id} &nbsp;·&nbsp; 🕐 ${formatDate(e.activated_at)}
          ${e.total_duration_seconds ? `&nbsp;·&nbsp; ⏱ ${formatDuration(e.total_duration_seconds)}` : ''}
        </div>
      </div>
    `).join('');

  } catch(err) {
    document.getElementById('statusDot').className = 'live-dot offline';
    document.getElementById('statusText').textContent = 'Sin conexión';
    document.getElementById('statusText').style.color = '#dc2626';
  }
}

buildSemaphores();
poll();
setInterval(poll, POLL_INTERVAL);
</script>
</body>
</html>
