<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynavia — Dashboard IoT Semáforos</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; color: #fff; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
  .header { background: linear-gradient(135deg, #1a1a2e, #16213e); padding: 20px 40px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #ffffff15; }
  .logo { font-size: 24px; font-weight: 800; background: linear-gradient(90deg, #00d4ff, #0099ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #00ff88; box-shadow: 0 0 8px #00ff88; animation: pulse 2s infinite; margin-left: auto; }
  .status-dot.offline { background: #ff4444; box-shadow: 0 0 8px #ff4444; animation: none; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .main { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 32px 40px; max-width: 1200px; margin: 0 auto; }
  .card { background: #12122a; border-radius: 20px; padding: 28px; border: 1px solid #ffffff10; }
  .card-title { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: #888; margin-bottom: 20px; }
  .semaphore-container { display: flex; justify-content: center; gap: 40px; margin: 20px 0; }
  .semaphore { background: #1a1a1a; border-radius: 16px; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; align-items: center; border: 2px solid #333; width: 80px; }
  .semaphore-id { font-size: 10px; color: #666; margin-top: 4px; }
  .light { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #333; transition: all 0.5s ease; }
  .light.red { background: #1a0000; }
  .light.red.on { background: #ff2200; box-shadow: 0 0 20px #ff2200, 0 0 40px #ff220055; border-color: #ff2200; }
  .light.yellow { background: #1a1400; }
  .light.yellow.on { background: #ffcc00; box-shadow: 0 0 20px #ffcc00, 0 0 40px #ffcc0055; border-color: #ffcc00; }
  .light.green { background: #001a00; }
  .light.green.on { background: #00ff44; box-shadow: 0 0 20px #00ff44, 0 0 40px #00ff4455; border-color: #00ff44; }
  .light.white { background: #0a0a0a; }
  .light.white.on { background: #ffffff; box-shadow: 0 0 20px #ffffff, 0 0 40px #ffffff88; border-color: #ffffff; }
  .banner { padding: 16px 24px; border-radius: 12px; text-align: center; margin-top: 16px; font-weight: 700; font-size: 14px; transition: all 0.5s; }
  .banner.emergency { background: linear-gradient(135deg, #ff220022, #ff220044); border: 1px solid #ff2200; color: #ff6644; }
  .banner.normal { background: linear-gradient(135deg, #00ff4422, #00ff4444); border: 1px solid #00ff44; color: #00ff44; }
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat { background: #0a0a1a; border-radius: 12px; padding: 16px; text-align: center; border: 1px solid #ffffff08; }
  .stat-value { font-size: 32px; font-weight: 800; color: #00d4ff; }
  .stat-label { font-size: 11px; color: #666; margin-top: 4px; }
  .events-list { max-height: 320px; overflow-y: auto; }
  .event-item { padding: 12px 16px; border-radius: 10px; margin-bottom: 8px; border-left: 3px solid; background: #0a0a1a; }
  .event-item.active { border-color: #ff2200; }
  .event-item.completed { border-color: #00ff44; }
  .event-row { display: flex; justify-content: space-between; align-items: center; }
  .event-id { font-size: 11px; color: #aaa; font-family: monospace; }
  .event-badge { font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: 700; }
  .badge-active { background: #ff220022; color: #ff6644; border: 1px solid #ff2200; }
  .badge-completed { background: #00ff4422; color: #00ff44; border: 1px solid #00ff44; }
  .event-meta { font-size: 11px; color: #666; margin-top: 4px; }
  .col-span { grid-column: span 2; }
  .level-badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .level-1 { background: #ff220022; color: #ff6644; border: 1px solid #ff2200; }
  .level-2 { background: #ffaa0022; color: #ffcc44; border: 1px solid #ffaa00; }
  .level-3 { background: #0088ff22; color: #44aaff; border: 1px solid #0088ff; }
</style>
</head>
<body>
<div class="header">
  <div class="logo">⚡ DYNAVIA</div>
  <span style="color:#666;font-size:13px">Dashboard IoT — Semáforos en tiempo real</span>
  <div class="status-dot" id="statusDot"></div>
  <span id="statusText" style="font-size:12px;color:#00ff88;margin-left:8px">Conectado</span>
</div>

<div class="main">
  <!-- Semáforos -->
  <div class="card">
    <div class="card-title">🚦 Estado Semáforos</div>
    <div class="semaphore-container" id="semaphoreContainer">
      <!-- generado por JS -->
    </div>
    <div class="banner normal" id="emergencyBanner">✅ Ciclo Normal — Sin emergencias activas</div>
  </div>

  <!-- Stats -->
  <div class="card">
    <div class="card-title">📊 Métricas del Sistema</div>
    <div class="stats-grid">
      <div class="stat"><div class="stat-value" id="statTotal">0</div><div class="stat-label">Total Eventos</div></div>
      <div class="stat"><div class="stat-value" id="statActive" style="color:#ff6644">0</div><div class="stat-label">Activos Ahora</div></div>
      <div class="stat"><div class="stat-value" id="statCompleted" style="color:#00ff44">0</div><div class="stat-label">Completados</div></div>
      <div class="stat"><div class="stat-value" id="statAvgDur" style="color:#ffcc00">0s</div><div class="stat-label">Duración Promedio</div></div>
    </div>
  </div>

  <!-- Historial -->
  <div class="card col-span">
    <div class="card-title">📋 Eventos Recientes — Base de Datos NeonDB</div>
    <div class="events-list" id="eventsList">
      <div style="color:#666;text-align:center;padding:40px">Cargando eventos...</div>
    </div>
  </div>
</div>

<script>
const BACKEND = 'http://192.168.56.101:3004';
const SEMAPHORES = ['SEM-001', 'SEM-002', 'SEM-003'];
let semaphoreState = {}; // 'normal' | 'emergency'
const POLL_INTERVAL = 2000;

// Construir semáforos
function buildSemaphores() {
  const container = document.getElementById('semaphoreContainer');
  container.innerHTML = SEMAPHORES.map(id => `
    <div style="text-align:center">
      <div class="semaphore" id="sem-${id}">
        <div class="light red" id="${id}-red"></div>
        <div class="light yellow" id="${id}-yellow"></div>
        <div class="light green on" id="${id}-green"></div>
        <div class="light white" id="${id}-white"></div>
      </div>
      <div class="semaphore-id">${id}</div>
    </div>
  `).join('');
  SEMAPHORES.forEach(id => semaphoreState[id] = 'normal');
}

function setSemaphore(id, mode) {
  const lights = ['red','yellow','green','white'];
  lights.forEach(l => document.getElementById(`${id}-${l}`)?.classList.remove('on'));
  if (mode === 'emergency') {
    document.getElementById(`${id}-white`)?.classList.add('on');
  } else {
    document.getElementById(`${id}-green`)?.classList.add('on');
  }
}

function formatDuration(s) {
  if (!s) return '--';
  const m = Math.floor(s/60), sec = s%60;
  return `${m}m ${sec}s`;
}

function formatDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  return `${dt.getDate()}/${dt.getMonth()+1} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
}

async function poll() {
  try {
    const res = await fetch(`${BACKEND}/events`);
    const data = await res.json();
    const events = data.events || [];

    // Status dot
    document.getElementById('statusDot').className = 'status-dot';
    document.getElementById('statusText').textContent = 'Conectado a NeonDB';
    document.getElementById('statusText').style.color = '#00ff88';

    // Stats
    const active = events.filter(e => e.status === 'active');
    const completed = events.filter(e => e.status === 'completed');
    const durations = completed.filter(e => e.total_duration_seconds).map(e => e.total_duration_seconds);
    const avgDur = durations.length ? Math.round(durations.reduce((a,b)=>a+b,0)/durations.length) : 0;

    document.getElementById('statTotal').textContent = events.length;
    document.getElementById('statActive').textContent = active.length;
    document.getElementById('statCompleted').textContent = completed.length;
    document.getElementById('statAvgDur').textContent = formatDuration(avgDur);

    // Semáforos — solo el evento activo MÁS RECIENTE manda
    const latestEvent = events[0];
    const hasEmergency = latestEvent && latestEvent.status === 'active' && latestEvent.severity_level <= 2;
    const emergencyEvent = hasEmergency ? latestEvent : null;
    SEMAPHORES.forEach(id => setSemaphore(id, hasEmergency ? 'emergency' : 'normal'));

    const banner = document.getElementById('emergencyBanner');
    if (hasEmergency && emergencyEvent) {
      banner.className = 'banner emergency';
      banner.textContent = `🚨 EMERGENCIA ACTIVA — LUZ BLANCA PREVENTIVA · Nivel ${emergencyEvent.severity_level} · ${emergencyEvent.id}`;
    } else {
      banner.className = 'banner normal';
      banner.textContent = '✅ Ciclo Normal — Sin emergencias activas';
    }

    // Lista eventos
    const list = document.getElementById('eventsList');
    list.innerHTML = events.slice(0,10).map(e => `
      <div class="event-item ${e.status}">
        <div class="event-row">
          <span class="event-id">${e.id}</span>
          <div style="display:flex;gap:8px;align-items:center">
            <span class="level-badge level-${e.severity_level}">Nivel ${e.severity_level}</span>
            <span class="event-badge ${e.status === 'active' ? 'badge-active' : 'badge-completed'}">
              ${e.status === 'active' ? '🔴 Activo' : '✅ Completado'}
            </span>
          </div>
        </div>
        <div class="event-meta">
          🚑 ${e.ambulance_id} &nbsp;·&nbsp; 🕐 ${formatDate(e.activated_at)}
          ${e.total_duration_seconds ? `&nbsp;·&nbsp; ⏱ ${formatDuration(e.total_duration_seconds)}` : ''}
        </div>
      </div>
    `).join('');

  } catch(err) {
    document.getElementById('statusDot').className = 'status-dot offline';
    document.getElementById('statusText').textContent = 'Sin conexión';
    document.getElementById('statusText').style.color = '#ff4444';
  }
}


buildSemaphores();
poll();
setInterval(poll, POLL_INTERVAL);
</script>
</body>
</html>
