services:
  ms-emergency:
    build: ./ms-emergency
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL}
      - MAPBOX_TOKEN=${MAPBOX_TOKEN_EMERGENCY}
      - METRICS_URL=http://ms-metrics:3004
      - TRAFFIC_URL=http://ms-traffic:3005
      - NOTIFICATIONS_URL=http://ms-notifications:3003
    restart: always

  ms-geolocation:
    build: ./ms-geolocation
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - DATABASE_URL=${DATABASE_URL}
      - MAPBOX_TOKEN=${MAPBOX_TOKEN_GEO}
    restart: always

  ms-notifications:
    build: ./ms-notifications
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - DATABASE_URL=${DATABASE_URL}
    restart: always

  ms-metrics:
    build: ./ms-metrics
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - DATABASE_URL=${DATABASE_URL}
    restart: always

  ms-traffic:
    build: ./ms-traffic
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - DATABASE_URL=${DATABASE_URL}
      - MQTT_BROKER=mqtt://mosquitto:1883
    restart: always
    depends_on:
      - mosquitto

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: always

  dashboard:
    image: nginx:alpine
    ports:
      - "8888:80"
    volumes:
      - ./dashboard.html:/usr/share/nginx/html/index.html:ro
    restart: always

  emqx:
    image: emqx:5
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    environment:
      - EMQX_MQTT__ALLOW_ANONYMOUS=true
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=public
      - EMQX_AUTH__MNESIA__PASSWORD_HASH=plain
      - EMQX_ALLOW_ANONYMOUS=true
      - EMQX_ACL_NOMATCH=allow
    restart: always
